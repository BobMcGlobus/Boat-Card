<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boat Card — Dev Preview</title>
    <style>
      :root {
        --primary-text-color: #16233a;
        --secondary-text-color: #48566e;
        --card-background-color: #fff;
        --ha-card-border-radius: 18px;
      }
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #e7eef8;
        color: var(--primary-text-color);
        padding: 24px;
      }
      body.dark {
        --primary-text-color: #eef3fb;
        --secondary-text-color: #a9b6cd;
        --card-background-color: #12203a;
        background: #0c1526;
      }
      .grid {
        max-width: 1100px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 20px;
        align-items: start;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      h1 {
        max-width: 1100px;
        margin: 0 auto 16px;
        font-size: 1.1rem;
      }
      button.themebtn {
        float: right;
        border: 1px solid #8886;
        background: transparent;
        color: inherit;
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>
      Boat Card — Dev Preview
      <button class="themebtn" onclick="document.body.classList.toggle('dark')">
        Light / Dark
      </button>
    </h1>
    <div class="grid">
      <div class="col" id="col-main"></div>
      <div class="col" id="col-side"></div>
    </div>
    <script type="module" src="/dev/demo.js"></script>
  </body>
</html>
